[phases.setup]
nixPkgs = [
    "php84",
    "php84Extensions.pdo",
    "php84Extensions.pdo_mysql",
    "php84Extensions.pdo_pgsql",
    "php84Extensions.mbstring",
    "php84Extensions.tokenizer",
    "php84Extensions.xml",
    "php84Extensions.ctype",
    "php84Extensions.fileinfo",
    "php84Extensions.bcmath",
    "php84Extensions.curl",
    "php84Extensions.zip",
    "php84Extensions.gd",
    "composer",
    "nodejs_22",
]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "npm ci",
    "npm run build",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache",
]

[start]
cmd = "php artisan migrate --force && php artisan storage:link && php artisan serve --host=0.0.0.0 --port=$PORT"
